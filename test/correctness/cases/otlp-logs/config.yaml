timeout: 20m
subject_os: [linux]
participants:
  adp:
    type: agent-adp
    subject: true
    connect: {intake: intake-adp.api}
    config:
      files:
        datadog.yaml: datadog.yaml
      env:
        DD_API_KEY: correctness-test
        DD_DATA_PLANE_ENABLED: "true"
        DD_DATA_PLANE_STANDALONE_MODE: "false"
        DD_DATA_PLANE_OTLP_ENABLED: "true"
        # Handle OTLP logs natively in ADP rather than relaying them to the core Agent. Per-signal proxy flags aren't
        # honored yet, so this turns off the proxy for every signal.
        DD_DATA_PLANE_OTLP_PROXY_ENABLED: "false"
        # TODO(#2177): Replace these ADP-only overrides with canonical schema-provided endpoint keys
        # once endpoint ownership prevents both processes from attempting to bind the same ports.
        ADP_DD_DATA_PLANE_OTLP_RECEIVER_GRPC_ENDPOINT_TEMPORARY: "0.0.0.0:54317"
        ADP_DD_DATA_PLANE_OTLP_RECEIVER_HTTP_ENDPOINT_TEMPORARY: "0.0.0.0:54318"
  agent:
    type: agent
    connect: {intake: intake-agent.api}
    config:
      files:
        datadog.yaml: datadog.yaml
      env:
        DD_API_KEY: correctness-test
  intake-adp:
    type: datadog-intake
  intake-agent:
    type: datadog-intake
  load:
    type: millstone
    connect:
      target: adp.otlp_grpc
      baseline_target: agent.agent_otlp_grpc
    config:
      files:
        millstone.yaml: {from: millstone.yaml, template: true}
procedure:
  - step: log_contains
    on: load
    process: baseline
    pattern: Millstone finished sending
    timeout: 15m
  - step: log_contains
    on: load
    process: subject
    pattern: Millstone finished sending
    timeout: 15m
  - step: process_stable_for
    on: load
    duration: 32s
  - step: compare
    kind: logs
    subject: intake-adp
    baseline: intake-agent
    logs:
      min_count: 1000
      # Every difference ADP shows today, tagged with its gap from the OTLP logs parity plan (DataDog/saluki#2966).
      # Remove an entry in the change that fixes its gap.
      known_differences:
        - gap: gap/content-in-message
          paths: ["content.**"]
          kinds: [location]
          reason: ADP puts properties at the top level instead of in the `message` content.
        - gap: gap/content-in-message
          paths: ["content.status"]
          kinds: [missing]
          reason: ADP's content holds only `message` and `service`, so it has no `status`.
        - gap: gap/empty-service
          paths: ["envelope.service"]
          kinds: [missing]
          reason: The Agent's envelope always has `service`, empty when unset; ADP omits an empty service.
        - gap: gap/status-strings
          paths: ["envelope.status"]
          kinds: [value]
          reason: ADP capitalizes the envelope status (`Info`, `Warning`) instead of sending the Agent's raw status.
        - gap: gap/envelope-timestamp
          paths: ["envelope.timestamp"]
          kinds: [missing]
          reason: ADP has no encode-time envelope `timestamp`.
        - gap: gap/default-hostname
          paths: ["envelope.hostname"]
          kinds: [missing]
          reason: ADP doesn't fall back to the Agent's hostname when the log has none.
        - gap: gap/attribute-key-case
          paths: ["content.*"]
          kinds: [missing]
          reason: ADP lowercases log attribute keys, so a mixed-case key is missing under its original spelling.
        - gap: gap/attribute-key-case
          paths: ["envelope_properties.*"]
          kinds: [extra]
          reason: ADP lowercases log attribute keys, so a mixed-case key appears under its lowercased spelling.
