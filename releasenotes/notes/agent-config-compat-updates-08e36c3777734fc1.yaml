---
fixes:
  - |
    ``metric_filterlist_prefix`` entries now decode as the Datadog Agent decodes them: an entry without ``prefix``
    uses the empty prefix, which matches every metric name apart from the entry's exceptions, and an entry that
    can't be decoded is logged and disables all prefix rules instead of rejecting the configuration.
  - |
    While ``expected_tags_duration`` attaches host tags to metrics, the ``infra_mode`` host tag is no longer
    attached, matching the Datadog Agent.
