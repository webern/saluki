# OTLP logs correctness test configuration, shared by the core Agent and Agent Data Plane.
# Using a fixed hostname is both required to avoid errors, and also will ensure consistent tags.
hostname: "correctness-testing"

# Dummy API key.
api_key: dummy-api-key-correctness-testing

# We have to specifically configure the health port to use.
health_port: 5555

# The Agent only builds its OTLP logs pipeline when both the logs agent and OTLP logs are enabled. Set both
# explicitly on both sides rather than relying on defaults.
logs_enabled: true

otlp_config:
  receiver:
    protocols:
      grpc:
        endpoint: "0.0.0.0:54317"
        max_recv_msg_size_mib: 4
  logs:
    enabled: true
